
<!DOCTYPE html>
<html lang="pt-AO" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BENGUI | Excelência em Manutenção Residencial</title>
    
    <link rel="preconnect" href="https://images.unsplash.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://esm.sh">

    <meta name="description" content="Manutenção residencial e industrial de excelência em Luanda. Canalização, eletricidade, carpintaria e muito mais." />
    <meta name="theme-color" content="#ea580c" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --brand-orange: #ea580c;
        --brand-dark: #0f172a;
        --glazed-gray: #f1f5f9;
        --mirror-silver: #e2e8f0;
      }
      body {
        font-family: 'Outfit', sans-serif;
        background-color: #f8fafc;
        color: #0f172a;
        overflow-x: hidden;
      }
      
      .bg-glazed-mirror {
        background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 50%, #f1f5f9 100%);
        background-attachment: fixed;
      }

      .mirror-overlay {
        position: fixed;
        inset: 0;
        background-image: url('https://www.transparenttextures.com/patterns/pinstriped-suit.png');
        opacity: 0.03;
        pointer-events: none;
        z-index: 1;
      }

      /* Acessibilidade: Estilos de foco nítidos para navegação por teclado */
      :focus-visible {
        outline: 3px solid var(--brand-orange);
        outline-offset: 4px;
        border-radius: 4px;
      }

      .nav-link-active::after {
        content: '';
        position: absolute;
        bottom: -4px;
        left: 0;
        width: 100%;
        height: 2px;
        background-color: var(--brand-orange);
        border-radius: 2px;
        transform: scaleX(1);
        transition: transform 0.3s ease;
      }

      .nav-link::after {
        content: '';
        position: absolute;
        bottom: -4px;
        left: 0;
        width: 100%;
        height: 2px;
        background-color: var(--brand-orange);
        border-radius: 2px;
        transform: scaleX(0);
        transition: transform 0.3s ease;
      }

      .nav-link:hover::after {
        transform: scaleX(1);
      }

      .animate-fade-in-up {
        animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .glass {
        background: rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }

      .glass-dark {
        background: rgba(15, 23, 42, 0.03);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #f1f5f9; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--brand-orange); }

      /* Melhoria de contraste para textos pequenos */
      .text-slate-400 { color: #64748b !important; }
      .text-slate-300 { color: #475569 !important; }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-glazed-mirror">
    <div class="mirror-overlay" aria-hidden="true"></div>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
